server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: graphql-security-poc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/securitypoc}
    username: ${DATABASE_USERNAME:securitypoc}
    password: ${DATABASE_PASSWORD:securitypoc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  graphql:
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:true}
    path: /graphql
    schema:
      locations: classpath:graphql/
      printer:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/security-poc}
          audiences: ${KEYCLOAK_AUDIENCE:graphql-api}

app:
  security:
    name-only-operations-enabled: ${NAME_ONLY_OPERATIONS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
